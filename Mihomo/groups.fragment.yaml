# Region groups use existing local nodes. Subscription-only mobile nodes are not invented.
proxy-groups:
- name: 🇯🇵日本节点
  type: url-test
  proxies:
  - 🇯🇵 日本-软银Softbank-UDP极速
  url: http://www.gstatic.com/generate_204
  interval: 600
  tolerance: 100
  timeout: 5000
  lazy: false
- name: 🇺🇸美国节点
  type: url-test
  proxies:
  - 🇺🇸 ISP · HY2前置
  - 🇺🇸 ISP · VLESS前置
  - 🇺🇸 美西-独立VPS-独享443
  - ⚡ 美西-独立VPS-Hysteria2极速抗丢包
  url: http://www.gstatic.com/generate_204
  interval: 600
  tolerance: 100
  timeout: 5000
  lazy: false
